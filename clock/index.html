<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock">
        <div class="numbers">
            <div class="twelve">12</div>
            <div class="one">1</div>
            <div class="three">3</div>
            <div class="six">6</div>
            <div class="nine">9</div>
        </div>
        <div class="arrows">
            <div class="hour"></div>
            <div class="minute"></div>
            <div class="second"></div>
        </div>
        <img src="https://imgs.search.brave.com/LMl9tMyEHHLOXTCfPAKXctjF2qTkEMXadwwPMYAW42k/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly93d3cu/ZnJlZXBuZ2xvZ29z/LmNvbS91cGxvYWRz/L3JvbGV4LXBuZy1s/b2dvL21hcHBpbi1y/b2xleC1wbmctbG9n/by0yMi5wbmc" alt="clock" class="img">
    </div>
    <script src="index.js"></script>
</body>
</html>
