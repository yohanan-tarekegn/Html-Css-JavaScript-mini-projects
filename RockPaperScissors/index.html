<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock-Paper-Scissors</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <h1 id="myh1">Rock - Paper - Scissors</h1>
    <div id="choices">
      <button onclick="play('rock')">👊</button>
      <button onclick="play('paper')">✋</button>
      <button onclick="play('scissor')">✌</button>
    </div>
    <label id="playerchoice">Player:</label>
    <label id="computerchoice">Computer:</label>
    <label id="result"></label>
    <div id="s">score</div>
    <div id="ps">player: <span id="pss"></span></div>
    <div id="cs">computer: <span id="css"></span></div>

    <script src="index.js"></script>
  </body>
</html>
