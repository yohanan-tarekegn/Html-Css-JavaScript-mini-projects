<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealTime-Character-Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>RealTime Character Counter</h2>
        <textarea id="textInput" placeholder="Type something..." maxlength="50"></textarea>
        <div class="counter">
            <div class="totalchar">
                <span id="charCount"></span> characters 
            </div>
            <div class="remainingchar">
            <span id="charRemaining"></span> characters remaining
            </div>  
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
